<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CABLE 82</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="letterbox">
  <div id="stage">
    <header id="band-header">
      <div id="header-left">
        <div id="ch-name">CABLE 82</div>
        <div id="ch-tagline">COMMUNITY BULLETIN BOARD</div>
      </div>
      <div id="header-right">
        <div id="ch-clock">--:--</div>
        <div id="ch-date"></div>
      </div>
    </header>
    <main id="page">
      <div id="page-kicker"></div>
      <div id="page-body"></div>
      <div id="page-time"></div>
      <div id="page-date"></div>
      <div id="page-weather">
        <div id="wx-location"></div>
        <div id="wx-temp"></div>
        <div id="wx-cond"></div>
        <div id="wx-hilo"></div>
        <div id="wx-sun"></div>
      </div>
    </main>
    <footer id="band-crawl">
      <div id="crawl-flag"></div>
      <div id="crawl-window">
        <div id="crawl-track"></div>
      </div>
    </footer>
    <div id="error-card" hidden>
      <div id="error-title">PLEASE STAND BY</div>
      <div id="error-sub">WE ARE EXPERIENCING TECHNICAL DIFFICULTIES</div>
      <div id="error-detail"></div>
    </div>
  </div>
</div>
<script src="config-schema.js"></script>
<script src="app.js"></script>
</body>
</html>
